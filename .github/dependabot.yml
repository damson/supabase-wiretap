version: 2
updates:
  # The package ships no runtime dependencies, so everything here is a devDependency
  # of the build and the test suite. Grouped and monthly, because a stream of
  # single-bump pull requests on a repository this size is noise.
  #
  # `target-branch` matters under gitflow. Without it Dependabot bases its pull
  # requests on the default branch, and a bump landing straight on `main` would
  # put a commit on the release branch that `develop` has never seen, which is
  # exactly the divergence the two-branch model exists to avoid.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
