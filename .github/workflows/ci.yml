name: CI

on:
  push:
    # Both long-lived branches. `develop` is where work integrates and where
    # pull requests are based; `main` carries releases. Measuring only one of
    # them leaves the other's history unverified, and a base branch nobody
    # measures is a base nobody can compare a pull request against.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every supported version reports, rather than the first failure hiding
      # the rest.
      fail-fast: false
      matrix:
        # The DEVELOPMENT floor, which is not the published one. The package
        # ships no runtime dependencies and supports Node 20 for the people who
        # install it; the toolchain that builds and tests it does not, because
        # `@supabase/supabase-js` requires `>=22.0.0` and the test runner has
        # since joined it. Running the suite under a Node its own runner says it
        # does not support buys a green tick and no information.
        #
        # The published floor is proved by `the tarball installs and imports`,
        # which installs nothing but the tarball, exactly as a consumer does.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test, with the 100% coverage thresholds enforced
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Packing needs the toolchain, so it runs on the development floor. Consuming
  # the result must not, which is why it is a separate job: a consumer installs
  # the tarball and nothing else, and the old single job proved the published
  # floor by installing the whole devDependency tree on it.
  pack:
    name: pack the tarball
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Pack
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          mkdir -p dist-tarball
          mv "$tarball" dist-tarball/

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: dist-tarball/*.tgz
          retention-days: 1

  package:
    # The name is load-bearing: it is a required status check on both long-lived
    # branches, and a required check that never runs blocks every pull request
    # forever.
    name: the tarball installs and imports
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The PUBLISHED floor from package.json `engines`, and no checkout: this
      # job is standing in for somebody who has the package and not the
      # repository. Nothing here installs a devDependency.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: /tmp/tarball

      # "It compiles" is not the same claim as "somebody could install this and
      # use it". The only way to make the second claim is to install the
      # artefact from outside the project and run it.
      - name: Install elsewhere, and use it
        run: |
          set -euo pipefail
          tarball="$(ls /tmp/tarball/*.tgz)"
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          printf '{"name":"consumer","private":true,"type":"module","version":"1.0.0"}\n' > package.json
          npm install --no-audit --no-fund "$tarball"
          cat > smoke.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { fakeSupabase, CHAIN_METHODS } from 'supabase-wiretap';

          const fake = fakeSupabase(() => ({ data: [{ id: 'e1' }], error: null }));
          const answer = await fake.client.from('entries').select('id').eq('status', 'pending');
          await fake.client.from('entries').insert({ lemma: 'kaz' });

          assert.deepEqual(answer.data, [{ id: 'e1' }]);
          assert.deepEqual(fake.calls[0].ops, [['select', 'id'], ['eq', 'status', 'pending']]);
          assert.deepEqual(fake.writes('entries', 'insert'), [{ lemma: 'kaz' }]);
          assert.equal(fake.touched('nowhere'), false);
          assert.ok(CHAIN_METHODS.length > 0);
          console.log('the packed tarball installs, imports and records.');
          EOF
          node smoke.mjs
